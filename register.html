<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>ثبت‌نام | کلینیک هوشمند</title>
</head>
<body>
<main class="auth-wrapper py-5">
        <div class="container">
            <div class="auth-card p-4 p-md-5">
                <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-4"><span class="brand-badge">ک</span><strong>کلینیک هوشمند</strong></a>
                <h2 class="fw-bold mb-2">ثبت‌نام بیمار</h2>
                <p class="text-secondary mb-4">اطلاعات اولیه را برای ساخت حساب وارد کنید.</p>
                <form>
                    <div class="row g-3">
                        <div class="col-md-6"><label class="form-label">نام</label><input class="form-control" placeholder="محمد"></div>
                        <div class="col-md-6"><label class="form-label">نام خانوادگی</label><input class="form-control" placeholder="احمدی"></div>
                        <div class="col-12"><label class="form-label">شماره موبایل</label><input type="tel" class="form-control" placeholder="09123456789"></div>
                        <div class="col-12"><label class="form-label">رمز عبور</label><input type="password" class="form-control" placeholder="حداقل ۸ کاراکتر"></div>
                    </div>
                    <a href="customer-dashboard.html" class="btn btn-primary w-100 mt-4">ایجاد حساب</a>
                </form>
                <p class="text-center mt-4 mb-0">قبلاً ثبت‌نام کرده‌اید؟ <a href="login.html">وارد شوید</a></p>
            </div>
        </div>
    </main>
</body>
</html>
