<body>
<nav class="navbar navbar-expand-lg site-navbar sticky-top">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="index.html">
                <span class="brand-badge">ک</span>
                کلینیک هوشمند
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="index.html">خانه</a></li>
                    <li class="nav-item"><a class="nav-link" href="reservation.html">رزرو نوبت</a></li>
                    <li class="nav-item"><a class="nav-link" href="customer-dashboard.html">پنل مشتری</a></li>
                    <li class="nav-item"><a class="nav-link" href="admin-dashboard.html">پنل ادمین</a></li>
                </ul>
                <div class="d-flex gap-2">
                    <a class="btn btn-outline-primary" href="login.html">ورود</a>
                    <a class="btn btn-primary" href="register.html">ثبت‌نام</a>
                </div>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="app-card p-4 p-md-5">
                    <h1 class="fw-bold mb-2">رزرو نوبت</h1>
                    <p class="text-secondary mb-4">پزشک، تاریخ و ساعت موردنظر خود را انتخاب کنید.</p>
                    <form class="row g-3">
                        <div class="col-md-6"><label class="form-label">تخصص</label><select class="form-select"><option>قلب و عروق</option><option>پوست و مو</option><option>داخلی</option><option>اطفال</option></select></div>
                        <div class="col-md-6"><label class="form-label">پزشک</label><select class="form-select"><option>دکتر احمدی</option><option>دکتر رضایی</option><option>دکتر کریمی</option></select></div>
                        <div class="col-md-6"><label class="form-label">تاریخ</label><input type="date" class="form-control"></div>
                        <div class="col-md-6"><label class="form-label">ساعت</label><select class="form-select"><option>۰۹:۰۰</option><option>۱۰:۳۰</option><option>۱۲:۰۰</option><option>۱۶:۳۰</option></select></div>
                        <div class="col-12"><label class="form-label">توضیحات</label><textarea class="form-control" rows="4" placeholder="در صورت نیاز توضیح کوتاه بنویسید"></textarea></div>
                        <div class="col-12"><a href="appointments.html" class="btn btn-primary btn-lg w-100">ثبت درخواست رزرو</a></div>
                    </form>
                </div>
            </div>
