<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>ورود | کلینیک هوشمند</title>
</head>
<body>
<main class="auth-wrapper py-5">
        <div class="container">
            <div class="auth-card p-4 p-md-5">
                <a href="index.html" class="text-decoration-none d-inline-flex align-items-center gap-2 mb-4"><span class="brand-badge">ک</span><strong>کلینیک هوشمند</strong></a>
                <h2 class="fw-bold mb-2">ورود به حساب</h2>
                <p class="text-secondary mb-4">برای مدیریت نوبت‌ها وارد حساب کاربری شوید.</p>
                <form>
                    <div class="mb-3"><label class="form-label">شماره موبایل</label><input type="tel" class="form-control" placeholder="مثلاً 09123456789"></div>
                    <div class="mb-3"><label class="form-label">رمز عبور</label><input type="password" class="form-control" placeholder="رمز عبور"></div>
                    <div class="d-flex justify-content-between align-items-center mb-4"><div class="form-check"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">مرا به خاطر بسپار</label></div><a href="#" class="text-decoration-none">فراموشی رمز؟</a></div>
                    <a href="customer-dashboard.html" class="btn btn-primary w-100">ورود</a>
                </form>
                <p class="text-center mt-4 mb-0">حساب ندارید؟ <a href="register.html">ثبت‌نام کنید</a></p>
            </div>
        </div>
    </main>
</body>
</html>
